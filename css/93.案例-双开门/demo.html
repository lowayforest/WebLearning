<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双开门效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        /* 1.布局：父子结构，父级大图，子集左右小图 */
        .father {
            display: flex;
            margin:30px auto;
            overflow: hidden;
            width: 1366px;
            height: 600px;
            background-image: url(./images/bg.jpg);
        }

        .father .left,
        .father .right {
            width: 50%;
            height: 600px;
            background-image: url(./images/fm.jpg);

            transition: all 1s;
        }

        .father .right {
            /* right精灵图右边的图片 */
            background-position: right 0;
        }
        /* 2. 鼠标悬停效果：左右移动 */
        .father:hover .left {
            transform: translate(-100%);
        }

        .father:hover .right {
            transform: translateX(100%);
        }
    </style>
</head>
<body>
    <div class="father">
            <div class="left"></div>
            <div class="right"></div>
    </div>
</body>
</html>
