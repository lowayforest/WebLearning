
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旋转效果</title>
    <style>
        img {
            width: 200px;
            transition: all 1s;
        }
        img:hover {
            /* 顺指针旋转 */
            transform: rotate(360deg);
            /* 逆时针旋转 */
            transform: rotate(-360deg);
        }
    </style>
</head>
<body>
    <img src="./image/rotate.png" alt="">
</body>
</html>
